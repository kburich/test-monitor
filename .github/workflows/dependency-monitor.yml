# Test harness for kburich/dependency-monitor.
#
# Staircase step 8: the reusable-workflow form, pinned at @v4. This checks
# that the wrapper threads the inputs and secrets through and passes the
# action's outputs up as job outputs. The direct-action form pinned at @main
# is what the rest of the staircase runs — restore it afterwards.
#
# Pushes drive the runs while the staircase is being walked; restore the
# cron afterwards:
#   schedule:
#     - cron: "0 6,18 * * *"

name: Dependency monitor (test)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  monitor:
    uses: kburich/dependency-monitor/.github/workflows/monitor.yml@v4
    permissions:
      contents: write   # baseline commit-back to the orphan branch
      issues: write     # rolling notification issues
    with:
      assignees: kburich
    secrets:
      rl-token: ${{ secrets.RL_TOKEN }}

  # The wrapper's outputs are half of its contract. Echo them from a second
  # job so each is checkable from the run page.
  outputs:
    runs-on: ubuntu-latest
    needs: monitor
    steps:
      - env:
          OUTPUTS: ${{ toJSON(needs.monitor.outputs) }}
        run: echo "$OUTPUTS" | jq .
