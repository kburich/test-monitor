# Test harness for kburich/dependency-monitor.
#
# Staircase step 8b: alert-on-first-run under a throwaway monitor-id. The
# id gives this run its own baseline branch and its own rolling issues, so
# it is a genuine first run beside the real monitor, whose state it never
# touches. Restore the direct-action form without the override afterwards,
# delete dependency-baseline/first-run-test and close the orphaned issue.
#
# Pushes drive the runs while the staircase is being walked; restore the
# cron afterwards:
#   schedule:
#     - cron: "0 6,18 * * *"

name: Dependency monitor (test)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # baseline commit-back to the orphan branch
      issues: write     # rolling notification issues
    concurrency:
      group: dependency-monitor-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - id: rl
        uses: kburich/dependency-monitor@main
        with:
          rl-token: ${{ secrets.RL_TOKEN }}
          assignees: kburich
          monitor-id: first-run-test
          alert-on-first-run: "true"

      - name: Echo outputs
        env:
          OUTPUTS: ${{ toJSON(steps.rl.outputs) }}
        run: echo "$OUTPUTS" | jq .
