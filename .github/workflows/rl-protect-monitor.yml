# Test harness for kburich/rl-protect-monitor.
#
# Pinned to the branch under test, not @v2: the reusable workflow
# (rl-protect-monitor/.github/workflows/monitor.yml) hard-pins the action at
# @v2 internally, so calling it would test the release rather than the working
# tree. Use the direct-action form while iterating, and switch to the reusable
# form once as a separate check that its input plumbing is right.
#
# Every push to main is a run while the staircase is being walked — the
# steps are driven by commits (lockfile edits, baseline edits) rather than by
# manual dispatch. The twice-daily cron is paused meanwhile so a scheduled
# firing cannot land between two steps; re-enable it once the staircase
# passes. Each run spends Spectra Assure entitlement units.

name: Dependency monitor (test)

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 6,18 * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # baseline commit-back to the orphan branch
      issues: write     # rolling notification issues
    # Matches the group used by the action's own examples, so dispatching
    # twice in quick succession queues instead of cancelling — a cancelled run
    # may already have posted its delta without committing the baseline.
    concurrency:
      group: rl-protect-monitor-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - id: rl
        uses: kburich/rl-protect-monitor@feat/append-only-issues
        with:
          rl-token: ${{ secrets.RL_TOKEN }}
          # Subscribes kburich when a rolling issue is opened. A thread
          # subscription cannot cover the malware issue, which does not exist
          # until the first 🚨 finding — assignment is what reaches someone.
          assignees: kburich
          # Auto-detection should pick package-lock.json; left implicit so the
          # detection order itself is under test.

      # The outputs are half of the contract, and the job summary does not
      # show them. Echo them so each step of the staircase is checkable from
      # the run page without downloading the delta artifact.
      - name: Echo outputs
        env:
          OUTPUTS: ${{ toJSON(steps.rl.outputs) }}
        run: echo "$OUTPUTS" | jq .
